<!doctype html>
<html lang="es" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <title>MARÉ POS - Sistema de Gestión</title>
    <meta name="description" content="Sistema de gestión minorista MARÉ" />
    <meta property="og:title" content="MARÉ POS" />
    <meta property="og:description" content="Gestión de inventario y ventas" />
    <script>
      // Console Sanitizer for Clean Environment
      (function() {
        const originalLog = window.console.log;
        const originalError = window.console.error;
        const originalWarn = window.console.warn;
        const originalInfo = window.console.info;
        const originalDebug = window.console.debug;
        
        const noiseKeywords = [
          '[vite]', 'WebSocket', 'GenerateAccessToken', 'firebase', 
          'favicon.ico', 'manifest.json', 'Failed to load resource',
          'Extension', 'Chrome', 'Mojo', 'DevTools', 'Heartbeat',
          'connection reset', 'HMR', 'hot update', 'sockjs-node',
          '_aistudio-iframe', 'gapi', 'googleapis', 'cb=gapi',
          'aistudio', 'ResizeObserver', 'chrome-extension'
        ];

        const shouldSuppress = (args) => {
          if (!args || args.length === 0) return false;
          try {
            const str = args.map(a => {
              if (typeof a === 'string') return a;
              if (a instanceof Error) return `${a.message} ${a.stack || ''}`;
              if (typeof a === 'object' && a !== null) {
                try { return JSON.stringify(a); } catch(_) { return String(a); }
              }
              return String(a);
            }).join(' ');
            return noiseKeywords.some(keyword => str.toLowerCase().includes(keyword.toLowerCase()));
          } catch (_) {
            return false;
          }
        };

        window.console.log = function(...args) {
          if (shouldSuppress(args)) return;
          originalLog.apply(console, args);
        };

        window.console.error = function(...args) {
          if (shouldSuppress(args)) return;
          originalError.apply(console, args);
        };
        
        window.console.warn = function(...args) {
          if (shouldSuppress(args)) return;
          originalWarn.apply(console, args);
        };

        window.console.info = function(...args) {
          if (shouldSuppress(args)) return;
          originalInfo.apply(console, args);
        };

        window.console.debug = function(...args) {
          if (shouldSuppress(args)) return;
          originalDebug.apply(console, args);
        };

        // Silence unhandled rejections from environment & OAuth/gapi tokens
        window.addEventListener('unhandledrejection', function(e) {
          const reasonStr = String(e.reason?.message || e.reason?.stack || e.reason || '');
          if (noiseKeywords.some(k => reasonStr.toLowerCase().includes(k.toLowerCase()))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        // Silence resource and script errors from environment
        window.addEventListener('error', function(e) {
          const msg = String(e.message || e.filename || e.target?.src || e.target?.href || '');
          if (noiseKeywords.some(k => msg.toLowerCase().includes(k.toLowerCase()))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="notranslate" translate="no">
    <div id="root" class="notranslate" translate="no"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
